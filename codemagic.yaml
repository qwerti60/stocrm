workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: prototype
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios_signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: ru.app72.stocrmMobileApp
        # App Store Connect → App → General → Apple ID (число). Задайте в Codemagic, если lookup по bundle id врёт.
        APP_STORE_APPLE_ID: ""
        API_BASE: http://45.81.33.7
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Firebase GoogleService-Info.plist
        script: |
          PLIST="ios/Runner/GoogleService-Info.plist"
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$PLIST"
            echo "Wrote $PLIST from Codemagic env"
          elif [ ! -f "$PLIST" ]; then
            echo "WARNING: $PLIST missing — iOS push and Settings → Notifications will not work until you add the file or GOOGLE_SERVICE_INFO_PLIST" >&2
          fi
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY"
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          APP="${APP_STORE_APPLE_ID:-$BUNDLE_ID}"
          MARKETING=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+]+).*/\1/')
          FROM_PUBSPEC=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          pick_num() {
            local line
            line=$(echo "$1" | tail -1 | tr -d '[:space:]')
            if echo "$line" | grep -Eq '^[0-9]+$'; then
              echo "$line"
            else
              echo 0
            fi
          }
          LATEST=0
          set +e
          ASC_BUILD=$(app-store-connect get-latest-build-number "$APP" --platform IOS --all-versions -s 2>/dev/null)
          TF_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP" --all-versions --not-expired -s 2>/dev/null)
          set -e
          for N in "$(pick_num "$ASC_BUILD")" "$(pick_num "$TF_BUILD")"; do
            if [ "$N" -gt "$LATEST" ] 2>/dev/null; then
              LATEST=$N
            fi
          done
          IOS_BUILD=$((LATEST + 1))
          if [ "$FROM_PUBSPEC" -gt "$IOS_BUILD" ]; then
            IOS_BUILD=$FROM_PUBSPEC
          fi
          if [ -n "${PROJECT_BUILD_NUMBER:-}" ] && [ "$PROJECT_BUILD_NUMBER" -gt "$IOS_BUILD" ]; then
            IOS_BUILD=$PROJECT_BUILD_NUMBER
          fi
          echo "App=$APP asc=$(pick_num "$ASC_BUILD") tf=$(pick_num "$TF_BUILD") latest=$LATEST pubspec=$FROM_PUBSPEC cm=$PROJECT_BUILD_NUMBER -> ios-build=$IOS_BUILD"
          flutter build ipa --release --no-tree-shake-icons \
            --build-name="$MARKETING" \
            --build-number="$IOS_BUILD" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE="$API_BASE"
          IPA=$(ls -1 build/ios/ipa/*.ipa | head -1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /dev/stdin <<< "$(unzip -p "$IPA" Payload/*.app/Info.plist | plutil -convert xml1 -o - -)" \
            || echo "Could not read CFBundleVersion from IPA"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
