workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: prototype
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios_signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: ru.app72.stocrmMobileApp
        API_BASE: http://45.81.33.7
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY"
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo 0)
          FROM_PUBSPEC=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          BUILD_NUMBER=$((LATEST + 1))
          if [ "$BUILD_NUMBER" -lt "$FROM_PUBSPEC" ]; then
            BUILD_NUMBER=$FROM_PUBSPEC
          fi
          if [ "$BUILD_NUMBER" -lt 2 ]; then
            BUILD_NUMBER=2
          fi
          echo "TestFlight latest=$LATEST pubspec=$FROM_PUBSPEC -> build-number=$BUILD_NUMBER"
          flutter build ipa --release --no-tree-shake-icons \
            --build-name=1.0.3 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE="$API_BASE"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
